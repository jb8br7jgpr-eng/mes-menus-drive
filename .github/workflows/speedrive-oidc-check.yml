name: Speedrive — test OIDC lecture seule
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify-backup-reader:
    runs-on: ubuntu-latest
    steps:
      - name: Authentification Google Cloud sans cle privee
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/667391645783/locations/global/workloadIdentityPools/speedrive-backups/providers/github-private-repo
          service_account: speedrive-backup-reader@speedrive-7e77c.iam.gserviceaccount.com
          token_format: access_token
      - name: Confirmer l'identite sans lire les donnees
        run: echo "Authentification federée réussie — aucune donnée Speedrive consultée."

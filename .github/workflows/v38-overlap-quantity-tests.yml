name: "V38 — pas de chevauchement et quantité claire (sans déploiement)"
on:
  push:
    branches: [speedrive-v38-bulk-layout-quantity-labels]
  pull_request:
    branches: [developpement-v1]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe app.js
        run: node --check app.js
      - name: Exécuter toutes les suites V35 à V38
        run: node --test tests/v35-portions-courses.test.mjs tests/v36-ergonomie.test.mjs tests/v37-compact-bulk-courses.test.mjs tests/v38-overlap-default-quantity.test.mjs tests/v38-carrefour-pack-oeufs.test.mjs
      - name: Aucun accès serveur, aucun déploiement
        run: echo "Tests unitaires et statiques uniquement"

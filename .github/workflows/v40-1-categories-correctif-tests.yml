name: "V40.1 — correctif catégories uniquement (sans déploiement)"
on:
  push:
    branches: [speedrive-v40-1-categories-correctif-seul]
  pull_request:
    branches: [developpement-v1]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe
        run: node --check app.js
      - name: Tester catégories + régressions Speedrive
        run: node --test tests/v35-portions-courses.test.mjs tests/v36-ergonomie.test.mjs tests/v37-compact-bulk-courses.test.mjs tests/v38-overlap-default-quantity.test.mjs tests/v38-carrefour-pack-oeufs.test.mjs tests/v38-stock-compact.test.mjs tests/v39-categories-produits.test.mjs tests/v40-filtres-coherents.test.mjs tests/v40-1-categories-visibles.test.mjs
      - name: Aucun déploiement ni modification Firebase
        run: echo "Test-only, no deployment"

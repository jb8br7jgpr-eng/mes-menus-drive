name: "V40 — filtres magasin et catégorie uniformisés (sans déploiement)"
on:
  push:
    branches: [speedrive-v40-filtres-coherents]
  pull_request:
    branches: [developpement-v1]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérification syntaxe JavaScript
        run: node --check app.js
      - name: Tests V35 à V40 et non-régression Cloud
        run: node --test tests/v35-portions-courses.test.mjs tests/v36-ergonomie.test.mjs tests/v37-compact-bulk-courses.test.mjs tests/v38-overlap-default-quantity.test.mjs tests/v38-carrefour-pack-oeufs.test.mjs tests/v38-stock-compact.test.mjs tests/v39-categories-produits.test.mjs tests/v40-filtres-coherents.test.mjs
      - name: Vérifier qu'aucun déploiement n'est exécuté
        run: echo "Tests en lecture seule, sans accès Firebase"

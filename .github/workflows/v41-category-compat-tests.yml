name: "V41 — visibilité des catégories et préconception stock (sans déploiement)"
on:
  push:
    branches: [speedrive-v41-stock-congelateur]
  pull_request:
    branches: [developpement-v1]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe JavaScript
        run: node --check app.js
      - name: Non-régression des V35 à V41
        run: node --test tests/v35-portions-courses.test.mjs tests/v36-ergonomie.test.mjs tests/v37-compact-bulk-courses.test.mjs tests/v38-overlap-default-quantity.test.mjs tests/v38-carrefour-pack-oeufs.test.mjs tests/v38-stock-compact.test.mjs tests/v39-categories-produits.test.mjs tests/v40-filtres-coherents.test.mjs tests/v41-categories-visibles.test.mjs
      - name: Tests uniquement, aucune écriture Firebase
        run: echo "Safe read-only tests, no deployment"

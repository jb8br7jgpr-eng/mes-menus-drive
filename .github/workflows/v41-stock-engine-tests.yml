name: "V41 — moteur stock maison/congélateur (sans déploiement)"
on:
  push:
    branches: [speedrive-v41-inventaire-moteur]
  pull_request:
    branches: [developpement-v1]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier syntaxe
        run: |
          node --check app.js
          node --check stock-engine-v41.mjs
      - name: Vérifier le moteur d'inventaire pur
        run: node --test tests/v41-stock-engine.test.mjs
      - name: Vérifier les fonctions existantes V35 à V40
        run: node --test tests/v35-portions-courses.test.mjs tests/v36-ergonomie.test.mjs tests/v37-compact-bulk-courses.test.mjs tests/v38-overlap-default-quantity.test.mjs tests/v38-carrefour-pack-oeufs.test.mjs tests/v38-stock-compact.test.mjs tests/v39-categories-produits.test.mjs tests/v40-filtres-coherents.test.mjs
      - name: Aucun déploiement ni opération Firebase
        run: echo "Pure module and tests only"

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f9f7f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Speedrive">
  <meta name="description" content="Organise tes 14 repas et prépare tes courses Carrefour Drive en quelques minutes.">
  <title>Speedrive — Menus et courses simplifiés</title>
  <link rel="manifest" href="./manifest.webmanifest?v=20261029-31">
  <link rel="icon" type="image/png" href="./speedrive-icon-v2.PNG?v=20261029-31">
  <link rel="apple-touch-icon" href="./speedrive-icon-v2.PNG?v=20261029-31">
  <link rel="stylesheet" href="./styles.css?v=20261030-40">
  <link rel="stylesheet" href="./firebase/v34-ui.css?v=20261029-34">
  <style>
    /* Navigation essentielle : 5 cases fixes, même si Safari conserve une ancienne feuille de style. */
    .bottom-nav { display: grid !important; grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }
    .bottom-nav > .nav-item { min-width: 0; max-width: 100%; overflow: hidden; }
    .bottom-nav > .nav-item > span:last-child { display: block; max-width: 100%; white-space: nowrap; }
  </style>
  <script defer src="./app.js?v=20261030-40"></script>
  <script type="module" src="./firebase/v34-ui.js?v=20261029-34"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar speedrive-topbar">
      <div class="speedrive-topbar-tools">
        <button class="round-btn" id="settingsBtn" aria-label="Sauvegardes et paramètres" title="Sauvegardes et paramètres">⚙</button>
      </div>
      <div class="speedrive-brand"><img class="speedrive-logo" src="./speedrive-logo-v2.PNG?v=20261029-31" alt="Speedrive — On fait la course pour les courses ?" width="1800" height="300"></div>
    </header>
    <main id="app" class="content" aria-live="polite">
      <div class="loading"><span class="spinner"></span>Préparation de l'application…</div>
    </main>
    <nav class="bottom-nav" aria-label="Navigation principale">
      <button data-tab="menus" class="nav-item active" aria-current="page"><span class="nav-icon"><svg class="speedrive-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="M8 14h3v3H8z"/></svg></span><span>Menus</span></button>
      <button data-tab="plats" class="nav-item"><span class="nav-icon"><svg class="speedrive-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v6M10 3v6M4 3v4a3 3 0 0 0 6 0M7 9v12"/><path d="M17 3c-2 3-3 6-3 10h5V3h-2zM19 13v8"/></svg></span><span>Plats</span></button>
      <button data-tab="produits" class="nav-item"><span class="nav-icon"><svg class="speedrive-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 9-4 9 4v10l-9 4-9-4z"/><path d="m3 7 9 4 9-4M12 11v10"/></svg></span><span>Produits</span></button>
      <button data-tab="courses" class="nav-item"><span class="nav-icon"><svg class="speedrive-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 13l2 2 5-5"/></svg></span><span>Courses</span></button>
      <button data-tab="drive" class="nav-item"><span class="nav-icon"><svg class="speedrive-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h2l2.3 11.4a2 2 0 0 0 2 1.6H19a2 2 0 0 0 2-1.7L22 7H5"/></svg></span><span>Drive</span></button>
    </nav>
  </div>
  <div id="v34CloudStatus" hidden aria-live="polite"></div>
  <div id="v34CloudGuard" hidden>
    <div class="v34-guard-card">
      <strong data-v34-guard-text>Connexion Firebase nécessaire</strong>
      <button type="button" class="v34-button v34-primary" data-v34-open>Compte et sauvegardes</button>
      <button type="button" class="v34-button" data-v34-refresh>Réessayer le chargement du serveur</button>
      <button type="button" class="v34-button" data-v34-export>Exporter une copie JSON de secours</button>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div id="v34SyncRoot" data-open="false"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
